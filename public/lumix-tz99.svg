<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.5" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3a4a4a"/>
      <stop offset="0.5" stop-color="#0c1212"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
  </defs>
  <!-- Corps -->
  <rect x="40" y="140" width="720" height="300" rx="26" fill="url(#body)"/>
  <!-- Bossage du viseur / flash -->
  <rect x="120" y="100" width="170" height="50" rx="12" fill="#0a0a0a"/>
  <rect x="520" y="110" width="90" height="32" rx="8" fill="#161616"/>
  <!-- Molette de mode -->
  <circle cx="650" cy="180" r="28" fill="#1a1a1a" stroke="#333" stroke-width="3"/>
  <circle cx="650" cy="180" r="10" fill="#0a0a0a"/>
  <!-- Bague de l'objectif -->
  <circle cx="300" cy="290" r="150" fill="#1b1b1b"/>
  <circle cx="300" cy="290" r="136" fill="#0d0d0d" stroke="#2c2c2c" stroke-width="4"/>
  <!-- Verre de l'objectif -->
  <circle cx="300" cy="290" r="110" fill="url(#glass)"/>
  <circle cx="300" cy="290" r="40" fill="#0b1a1a"/>
  <circle cx="284" cy="274" r="12" fill="#4b6b6b" opacity="0.6"/>
  <!-- Reflets -->
  <ellipse cx="250" cy="240" rx="30" ry="14" fill="#fff" opacity="0.08" transform="rotate(-25 250 240)"/>
  <!-- Logo -->
  <text x="300" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4" fill="#777">LUMIX</text>
  <!-- Témoin et capteur -->
  <circle cx="110" cy="200" r="8" fill="#1e2a2a"/>
  <rect x="620" y="330" width="90" height="20" rx="4" fill="#0a0a0a"/>
  <!-- Reflet sur le corps -->
  <rect x="40" y="140" width="720" height="40" rx="26" fill="#fff" opacity="0.03"/>
</svg>
